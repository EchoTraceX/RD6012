<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RD6006 · 数控电源上位机 (含曲线)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #05080d;
      --shell: #10151d;
      --panel: #161d27;
      --panel-soft: #121b24;
      --field: #121923;
      --border: #27303d;
      --border-soft: #2a3647;
      --title: #f4f8fb;
      --text: #d6dee6;
      --muted: #7d8a98;
      --accent: #3dc3d8;
      --accent-deep: #1e5e6b;
      --success: #4fd28e;
      --warning: #ffb347;
      --danger: #ff6b6b;
      --shadow: 0 24px 40px rgba(0, 0, 0, 0.42);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background:
        radial-gradient(circle at 16% 12%, rgba(61, 195, 216, 0.14), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(79, 210, 142, 0.08), transparent 24%),
        linear-gradient(180deg, #05080d 0%, #0a0f15 55%, #05080d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bahnschrift', 'Segoe UI', sans-serif;
      padding: 20px;
      color: var(--text);
    }

    .dashboard {
      max-width: 1400px;
      width: 100%;
      background: var(--shell);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 28px 30px 32px;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .title-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .model-badge {
      background: #131d28;
      padding: 8px 18px;
      border-radius: 60px;
      border: 1px solid #253244;
    }

    .model-badge h1 {
      font-weight: 600;
      font-size: 1.9rem;
      color: var(--title);
      letter-spacing: 0.4px;
    }

    .serial-panel {
      display: flex;
      gap: 25px;
      background: #131d28;
      padding: 8px 20px;
      border-radius: 16px;
      border: 1px solid #253244;
    }

    .serial-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .serial-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .serial-value {
      font-weight: 600;
      font-size: 1.2rem;
      font-family: 'Bahnschrift', 'Segoe UI', sans-serif;
      color: var(--title);
    }

    .conn-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #131d28;
      padding: 6px 16px 6px 14px;
      border-radius: 14px;
      border: 1px solid #253244;
    }

    .conn-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px rgba(79, 210, 142, 0.45);
      animation: pulse-green 1.8s infinite;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr;
      gap: 22px;
      margin-bottom: 24px;
    }

    /* 新增：曲线卡片占满下方，采用全宽 */
    .chart-card {
      grid-column: 1 / -1;
      margin-top: 8px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px 24px;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
      transition: transform 0.2s;
    }

    .card:hover {
      border-color: #345066;
      box-shadow: 0 14px 24px rgba(0, 0, 0, 0.22);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #243040;
      padding-bottom: 12px;
    }

    .card-header i {
      font-size: 1.6rem;
      color: var(--accent);
    }

    .card-header h3 {
      font-weight: 500;
      letter-spacing: 0.3px;
      font-size: 1.3rem;
      color: var(--title);
    }

    .readings-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
    }

    .reading-block {
      flex: 1;
      min-width: 100px;
    }

    .reading-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .reading-value {
      font-size: 2.5rem;
      font-weight: 600;
      font-family: 'Bahnschrift', 'Segoe UI', sans-serif;
      color: var(--title);
      line-height: 1.2;
    }

    .unit-sub {
      font-size: 1rem;
      font-weight: 400;
      color: var(--muted);
      margin-left: 6px;
    }

    .temp-dual {
      display: flex;
      gap: 25px;
      margin-top: 10px;
    }

    .temp-item {
      display: flex;
      flex-direction: column;
    }

    #vinVal,
    #tempC,
    #tempF {
      color: var(--title);
      font-weight: 600;
    }

    .set-control {
      display: flex;
      gap: 30px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .set-group {
      flex: 1;
    }

    .set-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .set-label i {
      font-size: 1.3rem;
      color: var(--accent);
    }

    .input-wrapper {
      background: var(--field);
      border-radius: 18px;
      padding: 4px 4px 4px 22px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border-soft);
      transition: 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61, 195, 216, 0.14);
    }

    .input-wrapper input {
      background: transparent;
      border: none;
      padding: 14px 0;
      font-size: 1.6rem;
      font-weight: 600;
      width: 120px;
      color: var(--title);
      font-family: 'Bahnschrift', 'Segoe UI', sans-serif;
      outline: none;
    }

    .input-wrapper span {
      margin-right: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .unit-badge {
      background: #1a2330;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 600;
      color: var(--text);
      border: 1px solid #2a3546;
    }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 30px;
      margin-top: 22px;
    }

    .protect-state {
      display: flex;
      gap: 20px;
    }
    .badge {
      padding: 8px 20px;
      border-radius: 14px;
      background: var(--panel-soft);
      border: 1px solid #263243;
      font-weight: 500;
    }
    .badge.active {
      background: var(--accent-deep);
      border-color: #2b7a8a;
      color: var(--title);
      box-shadow: 0 0 0 3px rgba(61, 195, 216, 0.08);
    }

    .cvcc-indicator {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-left: auto;
    }
    .pill {
      padding: 8px 24px;
      border-radius: 14px;
      font-weight: 600;
      background: var(--panel-soft);
      border: 1px solid #263243;
      text-transform: uppercase;
    }
    .pill.cv {
      color: var(--success);
      border-color: #2e886a;
    }
    .pill.cc {
      color: var(--warning);
      border-color: #9b6d1f;
    }

    .action-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 28px;
      justify-content: space-between;
    }

    .output-switch {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .switch-label {
      font-weight: 500;
    }
    .toggle-btn {
      background: #1a2330;
      border: 1px solid #2a3546;
      border-radius: 14px;
      padding: 12px 28px;
      font-weight: 600;
      font-size: 1.2rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: none;
    }
    .toggle-btn.on {
      background: #1d5d47;
      border-color: #2e886a;
      color: #f4f8fb;
      box-shadow: none;
    }

    .quick-recall {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-soft);
      padding: 5px 12px 5px 20px;
      border-radius: 16px;
      border: 1px solid #263243;
    }

    .recall-select {
      background: var(--field);
      color: var(--title);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
    }

    .lock-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .footer-note {
      margin-top: 22px;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    /* 图表容器 */
    .chart-container {
      position: relative;
      height: 220px;
      width: 100%;
      margin-top: 8px;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 220px !important;
      border-radius: 16px;
      background: #0f151d;
    }

    .ghost-btn,
    .primary-btn,
    .secondary-btn {
      border-radius: 14px;
      padding: 12px 22px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .ghost-btn:hover,
    .primary-btn:hover,
    .secondary-btn:hover {
      opacity: 0.92;
    }

    .ghost-btn {
      background: #1a2330;
      border: 1px solid #2a3546;
      color: var(--text);
    }

    .primary-btn {
      background: var(--accent-deep);
      border: 1px solid #2b7a8a;
      color: var(--title);
      box-shadow: none;
    }

    .secondary-btn {
      background: transparent;
      border: 1px solid #2a3546;
      color: var(--text);
    }

    @keyframes pulse-green {
      0% { opacity: 0.8; box-shadow: 0 0 5px rgba(79, 210, 142, 0.35); }
      50% { opacity: 1; box-shadow: 0 0 14px rgba(79, 210, 142, 0.55); }
      100% { opacity: 0.8; box-shadow: 0 0 5px rgba(79, 210, 142, 0.35); }
    }

    @media (max-width: 800px) {
      .grid-2col { grid-template-columns: 1fr; }
      .dashboard { padding: 20px; }
    }
  </style>
</head>
<body>
<div class="dashboard">
  <!-- 头部 -->
  <div class="header">
    <div class="title-section">
      <div class="model-badge">
        <h1>RD6006</h1>
      </div>
      <div class="conn-status">
        <span class="conn-dot"></span>
        <span>LINK · MODBUS</span>
      </div>
    </div>
    <div class="serial-panel">
      <div class="serial-item">
        <span class="serial-label"><i class="far fa-barcode"></i> SN</span>
        <span class="serial-value" id="snDisplay">8F3A-21C0</span>
      </div>
      <div class="serial-item">
        <span class="serial-label"><i class="far fa-microchip"></i> FW</span>
        <span class="serial-value" id="fwDisplay">V1.32</span>
      </div>
    </div>
  </div>

  <!-- 网格布局: 上两列 + 下方曲线图全宽 -->
  <div class="grid-2col">
    <!-- 左侧: 实时读数卡片 -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-chart-line"></i>
        <h3>实时监测</h3>
      </div>
      <div class="readings-row">
        <div class="reading-block">
          <div class="reading-label"><i class="fas fa-bolt"></i> 输出电压</div>
          <div class="reading-value" id="vOut">12.42<span class="unit-sub">V</span></div>
        </div>
        <div class="reading-block">
          <div class="reading-label"><i class="fas fa-exchange-alt"></i> 输出电流</div>
          <div class="reading-value" id="iOut">2.135<span class="unit-sub">A</span></div>
        </div>
        <div class="reading-block">
          <div class="reading-label"><i class="fas fa-charging-station"></i> 功率</div>
          <div class="reading-value" id="pOut">26.5<span class="unit-sub">W</span></div>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 12px;">
        <div><span class="reading-label">输入电压</span> <span style="font-size:1.6rem; font-weight:600;" id="vinVal">24.8</span><span class="unit-sub">V</span></div>
        <div class="temp-dual">
          <div class="temp-item">
            <span class="reading-label"><i class="fas fa-thermometer-half"></i> 摄氏</span>
            <span style="font-size: 1.7rem;" id="tempC">+36.5°C</span>
          </div>
          <div class="temp-item">
            <span class="reading-label"><i class="fas fa-thermometer-full"></i> 华氏</span>
            <span style="font-size: 1.7rem;" id="tempF">+97.7°F</span>
          </div>
        </div>
      </div>
      <div class="status-bar">
        <div class="protect-state">
          <span class="badge" id="protectOVP">OVP</span>
          <span class="badge" id="protectOCP">OCP</span>
          <span class="badge" id="protectOTP">OTP</span>
        </div>
        <div class="cvcc-indicator">
          <span class="pill cv" id="cvIndicator">CV</span>
          <span class="pill cc" id="ccIndicator">CC</span>
        </div>
      </div>
    </div>

    <!-- 右侧: 设定 & 快捷区 -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-sliders-h"></i>
        <h3>输出设定</h3>
        <div style="margin-left: auto;" class="lock-indicator">
          <i class="fas fa-lock-open" id="lockIcon" style="color:#3DC3D8;"></i>
          <span id="lockText">键盘未锁</span>
        </div>
      </div>
      <div class="set-control">
        <div class="set-group">
          <div class="set-label"><i class="fas fa-voltage"></i> 电压设置 (V)</div>
          <div class="input-wrapper">
            <input type="number" id="voltageSet" value="12.00" step="0.01" min="0" max="60">
            <span class="unit-badge">V</span>
          </div>
        </div>
        <div class="set-group">
          <div class="set-label"><i class="fas fa-current"></i> 电流设置 (A)</div>
          <div class="input-wrapper">
            <input type="number" id="currentSet" value="2.50" step="0.001" min="0" max="6">
            <span class="unit-badge">A</span>
          </div>
        </div>
      </div>
      <div style="margin-top: 32px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;">
        <div class="quick-recall">
          <i class="fas fa-memory" style="color:#3DC3D8;"></i>
          <span style="margin-right: 5px;">快捷调出 M</span>
          <select id="recallSelect" class="recall-select">
            <option value="0">M0 · 5.0V/1A</option>
            <option value="1">M1 · 9.0V/2A</option>
            <option value="2" selected>M2 · 12V/2.5A</option>
            <option value="3">M3 · 15V/1.5A</option>
            <option value="4">M4 · 20V/3A</option>
            <option value="5">M5 · 24V/2A</option>
            <option value="6">M6 · 30V/1A</option>
            <option value="7">M7 · 5V/3A</option>
            <option value="8">M8 · 3.3V/2A</option>
            <option value="9">M9 · 48V/0.5A</option>
          </select>
        </div>
        <button id="lockToggleBtn" class="ghost-btn">
          <i class="fas fa-key"></i> 锁定/解锁
        </button>
      </div>
    </div>

    <!-- 曲线图表卡片 (跨越两列) -->
    <div class="card chart-card">
      <div class="card-header">
        <i class="fas fa-wave-square"></i>
        <h3>电压 · 电流 · 功率 实时趋势</h3>
        <div style="margin-left: auto; display: flex; gap: 16px;">
          <span style="display:flex; align-items:center;"><span style="display:inline-block; width:12px; height:4px; background:#3DC3D8; border-radius:4px; margin-right:6px;"></span>电压(V)</span>
          <span style="display:flex; align-items:center;"><span style="display:inline-block; width:12px; height:4px; background:#FFB347; border-radius:4px; margin-right:6px;"></span>电流(A)</span>
          <span style="display:flex; align-items:center;"><span style="display:inline-block; width:12px; height:4px; background:#4FD28E; border-radius:4px; margin-right:6px;"></span>功率(W)</span>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="trendChart"></canvas>
      </div>
    </div>
  </div>

  <!-- 底部操作栏 -->
  <div class="action-bar">
    <div class="output-switch">
      <span class="switch-label"><i class="fas fa-power-off"></i> 输出控制</span>
      <button id="outputToggle" class="toggle-btn on">● 输出开启</button>
    </div>
    <div style="display: flex; gap: 16px;">
      <button id="applySettingsBtn" class="primary-btn">
        <i class="fas fa-cloud-upload-alt"></i> 应用设定
      </button>
      <button id="refreshBtn" class="secondary-btn">
        <i class="fas fa-sync-alt"></i> 刷新读数
      </button>
    </div>
  </div>
  <div class="footer-note">
    <span><i class="far fa-clock"></i> 指令间隔 ≥300ms · Modbus RTU 模拟</span>
    <span><i class="fas fa-chart-line"></i> 曲线更新: 实时</span>
  </div>
</div>

<script>
  (function(){
    "use strict";

    // ---------- 模拟寄存器数据 ----------
    const model = "RD6006";
    const snHigh = 0x8F3A, snLow = 0x21C0;
    const fwVersion = 1.32;

    let tempCelsiusSign = 0;      
    let tempCelsiusValue = 36.5;  
    let tempFahrenheitSign = 0;
    let tempFahrenheitValue = 97.7;

    let voltageSetVal = 12.00;    
    let currentSetVal = 2.500;    

    let outVoltage = 12.42;
    let outCurrent = 2.135;
    let outPower = 26.5;          
    let inputVoltage = 24.8;

    let keyboardLocked = false;    
    let protectStatus = 0;         
    let cvccState = 0;            
    let outputEnabled = true;     

    const presets = [
      {v:5.00, c:1.000}, {v:9.00, c:2.000}, {v:12.00, c:2.500}, {v:15.00, c:1.500},
      {v:20.00, c:3.000}, {v:24.00, c:2.000}, {v:30.00, c:1.000}, {v:5.00, c:3.000},
      {v:3.30, c:2.000}, {v:48.00, c:0.500}
    ];

    // DOM 元素
    const snDisplay = document.getElementById('snDisplay');
    const fwDisplay = document.getElementById('fwDisplay');
    const vOutEl = document.getElementById('vOut');
    const iOutEl = document.getElementById('iOut');
    const pOutEl = document.getElementById('pOut');
    const vinVal = document.getElementById('vinVal');
    const tempCEl = document.getElementById('tempC');
    const tempFEl = document.getElementById('tempF');
    const protectOVP = document.getElementById('protectOVP');
    const protectOCP = document.getElementById('protectOCP');
    const protectOTP = document.getElementById('protectOTP');
    const cvIndicator = document.getElementById('cvIndicator');
    const ccIndicator = document.getElementById('ccIndicator');
    const voltageSetInput = document.getElementById('voltageSet');
    const currentSetInput = document.getElementById('currentSet');
    const outputToggleBtn = document.getElementById('outputToggle');
    const lockToggleBtn = document.getElementById('lockToggleBtn');
    const lockIcon = document.getElementById('lockIcon');
    const lockText = document.getElementById('lockText');
    const recallSelect = document.getElementById('recallSelect');
    const applyBtn = document.getElementById('applySettingsBtn');
    const refreshBtn = document.getElementById('refreshBtn');

    // ---------- 图表初始化 ----------
    const ctx = document.getElementById('trendChart').getContext('2d');
    const maxDataPoints = 40;  // 保留最近40个点
    
    // 初始化数据数组
    let timeLabels = [];
    let voltageData = [];
    let currentData = [];
    let powerData = [];
    
    // 填充初始历史 (用当前值平铺)
    for (let i = 0; i < maxDataPoints; i++) {
      timeLabels.push('');
      voltageData.push(outVoltage);
      currentData.push(outCurrent);
      powerData.push(outVoltage * outCurrent);
    }
    // 最后几个时间标签显示秒
    for (let i = 0; i < maxDataPoints; i++) {
      if (i % 8 === 0) timeLabels[i] = `-${(maxDataPoints-i)*0.3}s`;
    }

    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: timeLabels,
        datasets: [
          {
            label: '电压 (V)',
            data: voltageData,
            borderColor: '#3DC3D8',
            backgroundColor: 'rgba(61, 195, 216, 0.05)',
            borderWidth: 2.2,
            pointRadius: 0,
            tension: 0.2,
            yAxisID: 'y',
          },
          {
            label: '电流 (A)',
            data: currentData,
            borderColor: '#FFB347',
            backgroundColor: 'transparent',
            borderWidth: 2.2,
            pointRadius: 0,
            tension: 0.2,
            yAxisID: 'y1',
          },
          {
            label: '功率 (W)',
            data: powerData,
            borderColor: '#4FD28E',
            backgroundColor: 'transparent',
            borderWidth: 2.0,
            pointRadius: 0,
            borderDash: [5, 3],
            tension: 0.2,
            yAxisID: 'y2',
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 200 },
        plugins: {
          legend: { display: false },  // 已用自定义图例
          tooltip: {
            mode: 'index',
            intersect: false,
            backgroundColor: '#10151D',
            titleColor: '#F4F8FB',
            bodyColor: '#D6DEE6',
            borderColor: '#27303D',
            borderWidth: 1
          }
        },
        scales: {
          x: { 
            grid: { color: '#243040', drawBorder: false },
            ticks: { color: '#7D8A98', maxRotation: 0, autoSkip: true, maxTicksLimit: 8 }
          },
          y: {
            position: 'left',
            grid: { color: '#243040' },
            ticks: { color: '#3DC3D8', callback: (v) => v.toFixed(1)+'V' },
            title: { display: true, text: '电压 (V)', color: '#7D8A98' }
          },
          y1: {
            position: 'right',
            grid: { drawOnChartArea: false },
            ticks: { color: '#FFB347', callback: (v) => v.toFixed(2)+'A' },
            title: { display: true, text: '电流 (A)', color: '#7D8A98' }
          },
          y2: {
            position: 'right',
            grid: { drawOnChartArea: false },
            ticks: { color: '#4FD28E', callback: (v) => v.toFixed(1)+'W' },
            title: { display: true, text: '功率 (W)', color: '#7D8A98' }
          },
        },
        elements: { line: { borderJoinStyle: 'round' } }
      }
    });

    // 更新图表数据 (每次刷新/设定时调用)
    function pushChartData(v, c, p) {
      // 移除最旧数据
      voltageData.shift(); currentData.shift(); powerData.shift();
      voltageData.push(v);
      currentData.push(c);
      powerData.push(p);
      
      // 更新时间标签
      const now = new Date();
      const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      timeLabels.shift();
      timeLabels.push(timeStr);
      
      chart.update();
    }

    // 通用UI刷新
    function refreshUI() {
      snDisplay.textContent = `${snHigh.toString(16).toUpperCase()}-${snLow.toString(16).toUpperCase()}`;
      fwDisplay.textContent = `V${fwVersion.toFixed(2)}`;

      const power = outVoltage * outCurrent;
      vOutEl.innerHTML = `${outVoltage.toFixed(2)}<span class="unit-sub">V</span>`;
      iOutEl.innerHTML = `${outCurrent.toFixed(3)}<span class="unit-sub">A</span>`;
      pOutEl.innerHTML = `${power.toFixed(2)}<span class="unit-sub">W</span>`;
      vinVal.textContent = inputVoltage.toFixed(1);

      const cSign = tempCelsiusSign === 1 ? '-' : '+';
      const fSign = tempFahrenheitSign === 1 ? '-' : '+';
      tempCEl.textContent = `${cSign}${tempCelsiusValue.toFixed(1)}°C`;
      tempFEl.textContent = `${fSign}${tempFahrenheitValue.toFixed(1)}°F`;

      protectOVP.classList.toggle('active', protectStatus === 1);
      protectOCP.classList.toggle('active', protectStatus === 2);
      protectOTP.classList.toggle('active', protectStatus === 3);
      
      if (cvccState === 0) {
        cvIndicator.style.background = '#1d5d47'; cvIndicator.style.color = '#f4f8fb';
        ccIndicator.style.background = '#121b24'; ccIndicator.style.color = '#7d8a98';
      } else {
        cvIndicator.style.background = '#121b24'; cvIndicator.style.color = '#7d8a98';
        ccIndicator.style.background = '#4c3920'; ccIndicator.style.color = '#ffb347';
      }

      voltageSetInput.value = voltageSetVal.toFixed(2);
      currentSetInput.value = currentSetVal.toFixed(3);

      if (outputEnabled) {
        outputToggleBtn.classList.add('on');
        outputToggleBtn.innerHTML = '● 输出开启';
      } else {
        outputToggleBtn.classList.remove('on');
        outputToggleBtn.innerHTML = '○ 输出关闭';
      }

      if (keyboardLocked) {
        lockIcon.className = 'fas fa-lock';
        lockIcon.style.color = '#ff6b6b';
        lockText.textContent = '键盘锁定';
      } else {
        lockIcon.className = 'fas fa-lock-open';
        lockIcon.style.color = '#3DC3D8';
        lockText.textContent = '键盘未锁';
      }
      
      // 更新曲线数据 (每次UI刷新都推送)
      pushChartData(outVoltage, outCurrent, power);
    }

    function simulateFeedback() {
      if (outputEnabled) {
        outVoltage = voltageSetVal * (0.98 + Math.random()*0.04);
        outCurrent = currentSetVal * (0.97 + Math.random()*0.06);
        cvccState = (outCurrent > currentSetVal*0.99) ? 1 : 0;
      } else {
        outVoltage = 0;
        outCurrent = 0;
        cvccState = 0;
      }
      tempCelsiusValue = 35 + (outCurrent*1.5) + (Math.random()*2-1);
      tempFahrenheitValue = tempCelsiusValue * 9/5 + 32;
      refreshUI();
    }

    function writeSettings() {
      if (keyboardLocked) { alert('键盘锁定，无法修改设定'); return; }
      let newV = parseFloat(voltageSetInput.value);
      let newC = parseFloat(currentSetInput.value);
      if (isNaN(newV) || newV<0) newV = 0;
      if (isNaN(newC) || newC<0) newC = 0;
      voltageSetVal = newV;
      currentSetVal = newC;
      simulateFeedback();
    }

    function toggleOutput() {
      if (keyboardLocked) { alert('键盘已锁定，无法切换输出。请先解锁。'); return; }
      outputEnabled = !outputEnabled;
      simulateFeedback();
    }

    function toggleLock() {
      keyboardLocked = !keyboardLocked;
      refreshUI();
    }

    function recallPreset(index) {
      if (keyboardLocked) { alert('键盘锁定，无法调出预设'); return; }
      const p = presets[index];
      if(p) {
        voltageSetVal = p.v;
        currentSetVal = p.c;
        voltageSetInput.value = voltageSetVal.toFixed(2);
        currentSetInput.value = currentSetVal.toFixed(3);
        simulateFeedback();
      }
    }

    function randomizeProtectForDemo() {
      const r = Math.random();
      if (r < 0.85) protectStatus = 0;
      else if (r < 0.92) protectStatus = 1;
      else if (r < 0.97) protectStatus = 2;
      else protectStatus = 3;
    }

    // 事件绑定
    outputToggleBtn.addEventListener('click', toggleOutput);
    lockToggleBtn.addEventListener('click', toggleLock);
    applyBtn.addEventListener('click', writeSettings);
    refreshBtn.addEventListener('click', ()=>{
      randomizeProtectForDemo();
      simulateFeedback();
    });
    recallSelect.addEventListener('change', (e)=>{
      recallPreset(parseInt(e.target.value, 10));
    });

    // 初始化UI + 预填充图表
    (function init() {
      snDisplay.textContent = `${snHigh.toString(16).toUpperCase()}-${snLow.toString(16).toUpperCase()}`;
      fwDisplay.textContent = `V${fwVersion.toFixed(2)}`;
      outVoltage = voltageSetVal * 1.02;
      outCurrent = currentSetVal * 0.96;
      // 用初始数据重设图表数组
      for (let i=0; i<maxDataPoints; i++) {
        voltageData[i] = outVoltage;
        currentData[i] = outCurrent;
        powerData[i] = outVoltage * outCurrent;
      }
      refreshUI();
    })();

    // 定时刷新 (自动推送曲线)
    setInterval(() => {
      if (outputEnabled) {
        outVoltage = voltageSetVal * (0.99 + Math.random()*0.03);
        outCurrent = currentSetVal * (0.98 + Math.random()*0.05);
        cvccState = (outCurrent > currentSetVal*1.02) ? 1 : 0;
        tempCelsiusValue = 35 + (outCurrent*2.0) + (Math.random()*1.5);
        tempFahrenheitValue = tempCelsiusValue * 9/5 + 32;
      } else {
        outVoltage = 0; outCurrent = 0;
      }
      refreshUI();
    }, 2800);  // 大于300ms
  })();
</script>
</body>
</html>
